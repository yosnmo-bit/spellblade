<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตำนานดาบเวท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Charm:wght@700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9E1EE; --panel:#F3F6FB; --panel-2:#E4EAF4; --ink:#1E2939; --ink-soft:#5B687E; --line:#C8D2E2;
  --title-a:#4D72B8; --title-b:#2E4C8C; --accent:#D18E22; --accent-ink:#8A5A12; --good:#2C9A57; --bad:#C6442E;
  --chip:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131D; --panel:#1B2232; --panel-2:#242D42; --ink:#E6EBF4; --ink-soft:#98A4BA; --line:#34405A;
    --title-a:#3B5A9C; --title-b:#22386C; --accent:#F0B24A; --accent-ink:#F4C877; --good:#4CC27D; --bad:#F06A50;
    --chip:#232C40;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131D; --panel:#1B2232; --panel-2:#242D42; --ink:#E6EBF4; --ink-soft:#98A4BA; --line:#34405A;
  --title-a:#3B5A9C; --title-b:#22386C; --accent:#F0B24A; --accent-ink:#F4C877; --good:#4CC27D; --bad:#F06A50;
  --chip:#232C40;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bai Jamjuree","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;font-size:15px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.px{font-family:"Silkscreen","Courier New",monospace}
#root{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0}
.screen[hidden]{display:none}

/* boot */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.logo{font-family:"Charm","Noto Serif Thai",serif;font-weight:700;font-size:clamp(2.6rem,12vw,3.2rem);line-height:1.1;color:var(--accent-ink)}
.muted{color:var(--ink-soft)}

/* create */
.create{height:100%;overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
.create h1{margin:0;text-align:center;font-family:"Charm","Noto Serif Thai",serif;font-size:2.1rem;line-height:1.15;color:var(--accent-ink)}
.stagebox{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 50% 75%,#3c5a3a,#1c2a20 70%);border:1px solid var(--line)}
#pv{display:block;width:100%;height:250px}
.rot{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,22,.5);color:#fff;font-size:1rem}
.rot.l{left:10px}.rot.r{right:10px}
.preview-jobs{display:flex;gap:6px;overflow-x:auto;padding:8px;scrollbar-width:none;position:absolute;left:0;right:0;bottom:0}
.preview-jobs::-webkit-scrollbar{display:none}
.pj{flex-shrink:0;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,14,22,.55);color:#e9eef7;font-size:.75rem}
.pj.on{background:#f0b24a;color:#2a1a04;border-color:#f7d48d}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.opt.col{flex-direction:column;align-items:stretch}
.opt > span,.opt > label{font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 18px;border:0;background:var(--chip)}
.seg button[aria-pressed="true"]{background:var(--title-b);color:#fff;font-weight:700}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
.stepper b{min-width:7.5em;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.opt input[type=text]{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:1.05rem}
.btn-main{padding:13px 18px;border:0;border-radius:14px;background:linear-gradient(#5b82c9,#2e4c8c);color:#fff;font-weight:700;font-size:1.05rem}
.btn-main:disabled{opacity:.45}
.fine{margin:0;text-align:center;font-size:.82rem;color:var(--ink-soft)}

/* game */
.game{background:#0d1118}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.plate{pointer-events:auto;display:flex;gap:8px;padding:6px 10px 7px 6px;border-radius:14px;background:rgba(10,14,24,.68);color:#f2f5fb;min-width:0;flex:1;border:1px solid rgba(255,255,255,.1)}
#avatar{width:54px;height:54px;border-radius:10px;background:radial-gradient(circle at 50% 70%,#3c4f72,#1b2335);flex-shrink:0}
.plate-in{flex:1;min-width:0}
.nm{font-weight:700;font-size:.92rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb{font-size:.72rem;color:#b9c4da;line-height:1.2}
.gbar{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:3px}
.gbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit}
.gbar.hp i{background:linear-gradient(#7ee596,#2ea44f)}
.gbar.sp i{background:linear-gradient(#89b8ff,#2f6ad2)}
.gbar span{position:absolute;inset:0;font:700 8px/10px "Silkscreen",monospace;text-align:center;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.lv{display:flex;gap:5px;align-items:center;font:700 8px/1 "Silkscreen",monospace;margin-top:4px;color:#e7ecf5;white-space:nowrap}
.thin{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.thin i{display:block;height:100%;width:0}
.thin.bx i{background:#f3c24a}.thin.jx i{background:#c49bff}
.money{pointer-events:auto;padding:6px 9px;border-radius:12px;background:rgba(10,14,24,.68);color:#ffd977;font:700 10px/1.3 "Silkscreen",monospace;white-space:nowrap;border:1px solid rgba(255,255,255,.1);text-align:right}
.money small{display:block;color:#b9c4da;font:500 10px/1.3 "Bai Jamjuree",sans-serif}
.notice{position:absolute;left:8px;right:62px;top:84px;padding:4px 10px;border-radius:10px;background:rgba(10,14,24,.6);color:#ffe7a6;font-size:.78rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.notice[hidden]{display:none}
.side{position:absolute;right:8px;top:84px;display:flex;flex-direction:column;gap:4px}
.sbtn{position:relative;width:46px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,24,.66);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.05rem;line-height:1;padding:0}
.sbtn small{font-size:.56rem;margin-top:3px;color:#cfd8ea}
.sbtn .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#e8473a;color:#fff;font:700 8px/17px "Silkscreen",monospace;padding:0 3px}
.sbtn .dot[hidden]{display:none}
.sbtn.glow{border-color:#ffd166;box-shadow:0 0 12px rgba(255,209,102,.8)}
.sbtn[hidden]{display:none}
.hud-bottom{position:absolute;left:8px;right:8px;bottom:10px;display:flex;align-items:flex-end;gap:7px}
.pots{display:flex;flex-direction:column;gap:6px}
.pot{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(10,14,24,.66);font-size:1.2rem;padding:0}
.pot b{position:absolute;right:3px;bottom:2px;font:700 8px "Silkscreen",monospace;color:#fff}
.pot.blue{filter:hue-rotate(200deg)}
.pot.blue b{filter:hue-rotate(-200deg)}
.skills{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sk{position:relative;aspect-ratio:1;max-height:68px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(10,14,24,.68);color:#fff;display:grid;place-items:center;overflow:hidden;padding:0}
.sk .ic{width:68%;height:68%;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 45%),var(--c,#567)}
.sk .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.66) calc(var(--cd,0)*360deg),transparent 0)}
.sk .slv{position:absolute;left:4px;bottom:3px;font:700 7px "Silkscreen",monospace}
.sk.nosp .ic{filter:grayscale(.85) brightness(.65)}
.sk.empty{color:rgba(255,255,255,.5);font-size:1.3rem}
.auto{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(10,14,24,.72);color:#fff;font:700 12px "Silkscreen",monospace;flex-shrink:0;padding:0}
.auto[aria-pressed="true"]{background:radial-gradient(circle at 40% 35%,#ffe08a,#e08a1e);color:#3a2306;border-color:#ffe39a;box-shadow:0 0 16px rgba(255,190,70,.75)}
.dead{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,12,.55);color:#fff;text-align:center}
.dead[hidden]{display:none}
.dead .big{font-family:"Charm","Noto Serif Thai",serif;font-size:2.4rem;font-weight:700;color:#ff8f7a}

.auto{position:relative}
.auto .dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#e8473a;color:#fff;font:700 9px/18px "Silkscreen",monospace;padding:0 3px}
.auto .dot[hidden]{display:none}
.zoom{position:absolute;left:8px;top:46%;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(10,14,24,.62);color:#fff;font-size:1.15rem;line-height:1;padding:0}
.autolist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.autoc{display:flex;align-items:center;gap:8px;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--chip);text-align:left}
.autoc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--chip));box-shadow:0 0 0 1px var(--accent)}
.autoc .ai{font-size:1.45rem}.autoc .an{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.autoc small{color:var(--ink-soft);font-size:.72rem}
.pot .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#e8473a;color:#fff;font:700 8px/17px "Silkscreen",monospace;padding:0 3px}
.pot .dot[hidden]{display:none}
.chatfeed{position:absolute;left:58px;right:76px;bottom:84px;display:flex;flex-direction:column;gap:2px;pointer-events:none;font-size:.74rem}
.chatfeed .cl{background:rgba(10,14,24,.6);color:#e9eef7;padding:2px 8px;border-radius:8px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatfeed .cl.wd b{color:#9fe3ff}.chatfeed .cl.pt b{color:#8dff9a}.chatfeed .cl.sys{color:#ffe08a}
.partyhud{position:absolute;left:8px;top:112px;width:150px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.partyhud[hidden]{display:none}
.pm{background:rgba(10,14,24,.62);border-radius:8px;padding:3px 8px;color:#e9eef7;font-size:.72rem;line-height:1.3}
.pm em{display:block;height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:2px;overflow:hidden}
.pm i{display:block;height:100%;background:#3fd06a}.pm.away{opacity:.6}
.invite{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(10,14,24,.92);color:#fff;font-size:.84rem;border:1px solid #ffd166;width:max-content;max-width:94%}
.invite[hidden]{display:none}
.chatlist{height:min(46vh,360px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel-2);margin-top:8px;font-size:.88rem;-webkit-user-select:text;user-select:text}
.chatlist .cl{padding:3px 0;overflow-wrap:anywhere}
.chatlist .cl.wd b{color:#4d8fe0}.chatlist .cl.pt b{color:var(--good)}.chatlist .cl.sys{color:var(--accent-ink)}
.tm{color:var(--ink-soft);font-size:.72rem}
.chatin{display:flex;gap:6px;margin-top:8px}
.chatin input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:1rem}
.cslots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cslot{padding:8px;border-radius:10px;border:1px dashed var(--line);background:var(--chip);font-size:.8rem;min-height:62px}
.cslot.on{border-style:solid;border-color:var(--c,#a080e0);background:linear-gradient(135deg,color-mix(in srgb,var(--c,#a080e0) 24%,var(--chip)),var(--chip))}
.cslot .mini{margin-top:4px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:1.35rem;display:grid;place-items:center;padding:0}
.tile b{position:absolute;right:4px;bottom:2px;font:700 9px "Silkscreen",monospace;color:var(--ink)}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.tile.card{background:linear-gradient(160deg,color-mix(in srgb,var(--c,#a080e0) 45%,var(--chip)),var(--chip))}
.tile.empty{border-style:dashed;opacity:.45}
.invdet{padding:10px;border-radius:12px;background:var(--panel-2);margin-top:6px}

.plate #avatar{cursor:pointer}
.eqwrap{position:fixed;inset:0;z-index:35;display:flex;justify-content:center;align-items:stretch;background:rgba(5,8,15,.45);padding:calc(10px + env(safe-area-inset-top,0px)) 8px calc(10px + env(safe-area-inset-bottom,0px))}
.eqwrap[hidden]{display:none}
.eqbox{width:100%;max-width:470px;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:16px;border:1px solid var(--line);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.eqbox .sheet-title button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;padding:0}
.eqbody{flex:1;overflow-y:auto;padding:10px 12px 18px}
.eqmain{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:start}
.eqcol{display:flex;flex-direction:column;gap:6px}
.eqslot{position:relative;width:64px;height:62px;border-radius:12px;border:1px solid var(--line);background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;gap:1px}
.eqslot .ei{font-size:1.45rem;line-height:1}
.eqslot small{font-size:.62rem;color:var(--ink-soft)}
.eqslot.empty .ei{opacity:.35}
.eqslot.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.eqslot .eref{position:absolute;top:2px;left:4px;font:700 8px "Silkscreen",monospace;color:var(--accent-ink)}
.sdots{display:flex;gap:2px;height:6px}
.sdots i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink-soft)}
.sdots i.on{background:#b47aff;border-color:#b47aff}
.eqcenter{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.eqcv{width:100%;height:290px;display:block;border-radius:14px;background:radial-gradient(circle at 50% 78%,#3d5a48,#1c2a24 72%);touch-action:none;cursor:grab}
.eqname{font-weight:700;margin-top:6px}.eqjob{font-size:.76rem;color:var(--ink-soft)}
.eqmini{display:flex;gap:10px;font-size:.72rem;color:var(--ink-soft);margin-top:2px}.eqmini b{color:var(--ink)}
.eqdet{margin-top:10px;padding:10px;border-radius:12px;background:var(--panel-2)}
.sock{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:.84rem;flex-wrap:wrap}
.sock span{flex:1;min-width:0}.sock small{color:var(--ink-soft);width:100%;order:3}
.sock.on span{color:#9a5ae0;font-weight:700}
.picklist{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.pickc{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);text-align:left}
.pickc small{color:var(--ink-soft);font-size:.74rem}
.tile em{position:absolute;left:3px;top:2px;font-style:normal;font-size:.55rem;color:#1e2939;background:rgba(255,255,255,.8);border-radius:4px;padding:0 3px}

.bossbar{position:absolute;left:50%;top:112px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;z-index:5;max-width:62%}
.bossbar[hidden]{display:none}
.bossrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 10px;border-radius:10px;border:1px solid rgba(255,190,90,.5);background:rgba(30,12,8,.72);color:#ffe0b0;font-size:.74rem;white-space:nowrap}
.bossrow b{font-size:.66rem;color:#ffd36b}
.bossrow.alive{border-color:#ff6b4a;box-shadow:0 0 10px rgba(255,90,60,.5)}
.bossrow.alive b{color:#ff8f6b}
.bossann{position:absolute;left:50%;top:36%;transform:translate(-50%,-10px) scale(.96);opacity:0;pointer-events:none;z-index:25;padding:12px 18px;border-radius:14px;background:rgba(20,8,6,.86);border:2px solid #ffb04a;color:#fff3d6;font-weight:700;font-size:1rem;text-align:center;width:max-content;max-width:88%;transition:opacity .35s,transform .35s;text-shadow:0 1px 0 #000}
.bossann.show{opacity:1;transform:translate(-50%,0) scale(1)}
.bossann.k-spawn,.bossann.k-here{border-color:#ff5a3a;box-shadow:0 0 24px rgba(255,80,50,.6)}
.bossann.k-dead{border-color:#ffd36b}
@media (prefers-reduced-motion: reduce){.bossann{transition:none}}

.selwrap{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 18px}
.selmsg{margin:0;min-height:1.2em;text-align:center;color:var(--ink-soft);font-size:.9rem;max-width:340px}
.selmsg.away{color:var(--bad);font-weight:600}
.selcard{width:100%;max-width:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
#selCv{display:block;width:100%;height:300px;background:radial-gradient(circle at 50% 78%,#3d5a48,#1c2a24 72%);touch-action:none;cursor:grab}
.selinfo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px 12px;font-size:.85rem;color:var(--ink-soft)}
.selinfo b{font-size:1.15rem;color:var(--ink)}
.selwrap .btn-main{width:100%;max-width:340px}
.selacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(5,8,15,.28)}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:480px;margin:0 auto;max-height:78%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.sheet-title{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 14px;border-radius:15px 15px 0 0;background:linear-gradient(var(--title-a),var(--title-b));color:#fff;font-weight:700}
.sheet-title button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;padding:0}
.sheet-body{overflow-y:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ph .t{font-weight:700;font-size:1.05rem}
.pts{padding:8px 12px;border-radius:12px;background:var(--panel-2);margin-bottom:8px;font-size:.9rem}
.pts b{color:var(--accent-ink);font-size:1.05rem}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow .n{font:700 .85rem "Silkscreen",monospace}
.srow .d{font-size:.75rem;color:var(--ink-soft)}
.srow .v{font-weight:700;text-align:right;min-width:4.2em}
.srow .v em{font-style:normal;color:var(--good);font-size:.85rem;margin-left:2px}
.srow .btns{display:flex;gap:4px}
.mini{min-width:38px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:.82rem}
.mini.pri{background:var(--title-b);color:#fff;border-color:var(--title-b)}
.mini.warn{color:var(--bad)}
.mini:disabled{opacity:.4}
.mini.on{background:var(--accent);color:#2a1a04;border-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.kv div{padding:7px 8px;border-radius:10px;background:var(--panel-2);font-size:.72rem;color:var(--ink-soft)}
.kv b{display:block;color:var(--ink);font-size:.95rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sub{margin:14px 0 4px;font-weight:700;color:var(--accent-ink);font-size:.92rem}
.card{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.card .ic{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:1.15rem;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 45%),var(--c,#567)}
.card .bd{flex:1;min-width:0}
.card .nm2{font-weight:700}
.card .ds{font-size:.8rem;color:var(--ink-soft)}
.card .meta{font-size:.72rem;color:var(--ink-soft);margin-top:2px}
.slots{display:flex;gap:4px;margin-top:6px;align-items:center;font-size:.72rem;color:var(--ink-soft)}
.req{display:flex;gap:8px;margin:6px 0 10px}
.req span{flex:1;padding:8px 10px;border-radius:10px;background:var(--panel-2);font-size:.85rem}
.req .ok{color:var(--good);font-weight:700}.req .no{color:var(--bad);font-weight:700}
.jobc{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--chip);margin-top:8px}
.jobc canvas{width:64px;height:76px;flex-shrink:0;border-radius:10px;background:radial-gradient(circle at 50% 75%,#3c4f72,#1b2335)}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row .grow{flex:1;min-width:0}
.list-row .rk{width:1.8rem;text-align:center;font:700 .8rem "Silkscreen",monospace;color:var(--ink-soft)}
.empty{padding:16px 0;color:var(--ink-soft);font-size:.9rem}

/* GM */
.gm-sec{padding:12px 0;border-bottom:1px solid var(--line)}
.gm-sec h3{margin:0 0 6px;font-size:1rem}
.note{margin:0 0 8px;font-size:.78rem;color:var(--ink-soft)}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.74rem;color:var(--ink-soft);min-width:0}
.fld input,.fld select,.gm-sec textarea{width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:.9rem}
.fld input[type=color]{padding:2px;height:34px}
.fld.ck{flex-direction:row;align-items:center;gap:6px;font-size:.82rem;color:var(--ink)}
textarea{resize:vertical;min-height:4.2em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
details.box{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;background:var(--chip)}
details.box summary{font-weight:700;cursor:pointer}
.medit{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.prow{display:flex;flex-direction:column;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow .hd{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.prow .ct{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.prow input{width:4.4rem;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:var(--chip)}
.savebar{position:sticky;bottom:0;margin-top:12px;padding:9px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between}
.savebar span{font-size:.78rem;color:var(--ink-soft)}

/* toast & modal */
.toast{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;pointer-events:none;z-index:60;padding:9px 16px;border-radius:12px;background:rgba(10,14,24,.88);color:#fff;font-weight:600;font-size:.9rem;max-width:min(88vw,420px);text-align:center;transition:opacity .2s,transform .2s;border:1px solid rgba(255,255,255,.15)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(5,8,15,.55)}
.modal[hidden]{display:none}
.mcard{width:100%;max-width:360px;max-height:80vh;overflow:auto;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.mcard .sheet-title{border-radius:15px 15px 0 0}
.mcard .mb{padding:14px 16px 16px}
.mcard p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 14px}
.mcard .btn-main{width:100%}
</style>
</head>
<body>
<div id="root">
  <section class="screen center" id="scrBoot">
    <div class="logo">ตำนานดาบเวท</div>
    <p class="muted" id="bootMsg">กำลังเชื่อมต่อโลก…</p>
  </section>

  <section class="screen" id="scrCreate" hidden>
    <div class="create">
      <h1>สร้างตัวละคร</h1>
      <div class="stagebox">
        <canvas id="pv"></canvas>
        <button class="rot l" id="rotL" aria-label="หันซ้าย">◀</button>
        <button class="rot r" id="rotR" aria-label="หันขวา">▶</button>
        <div class="preview-jobs" id="pvJobs" aria-label="ดูตัวอย่างชุดอาชีพ"></div>
      </div>
      <div class="opt"><span>เพศ</span>
        <div class="seg"><button data-g="m" aria-pressed="true">ชาย</button><button data-g="f" aria-pressed="false">หญิง</button></div>
      </div>
      <div class="opt"><span>ทรงผม</span>
        <div class="stepper"><button id="hairPrev" aria-label="ทรงผมก่อนหน้า">◀</button><b id="hairName"></b><button id="hairNext" aria-label="ทรงผมถัดไป">▶</button></div>
      </div>
      <div class="opt col"><span>สีผม</span><div class="swatches" id="swatches"></div></div>
      <div class="opt col"><label for="nameIn">ชื่อตัวละคร</label>
        <input type="text" id="nameIn" maxlength="16" autocomplete="off" placeholder="2–16 ตัวอักษร">
      </div>
      <button class="btn-main" id="createBtn" disabled>สร้างตัวละคร</button>
      <p class="fine">เริ่มต้นเป็น Novice และเปลี่ยนอาชีพได้เมื่อ Base Lv 10 กับ Job Lv 10</p>
    </div>
  </section>

  <section class="screen" id="scrSelect" hidden>
    <div class="selwrap">
      <div class="logo">ตำนานดาบเวท</div>
      <p class="selmsg" id="selMsg" role="status"></p>
      <div class="selcard">
        <canvas id="selCv" aria-label="ตัวละครของคุณ ลากเพื่อหมุน"></canvas>
        <div class="selinfo"><b id="selName"></b><span id="selJob"></span><span id="selMap"></span></div>
      </div>
      <button class="btn-main" id="selEnter">เข้าสู่เกม</button>
      <div class="selacts"><button class="mini warn" id="selNew">สร้างตัวละครใหม่</button><button class="mini" id="selOut" hidden>ออกจากระบบ</button></div>
    </div>
  </section>

  <section class="screen game" id="scrGame" hidden>
    <canvas id="world"></canvas>
    <div class="hud-top">
      <div class="plate">
        <canvas id="avatar"></canvas>
        <div class="plate-in">
          <div class="nm" id="hName"></div>
          <div class="jb" id="hJob"></div>
          <div class="gbar hp"><i id="hpI"></i><span id="hpT"></span></div>
          <div class="gbar sp"><i id="spI"></i><span id="spT"></span></div>
          <div class="lv"><span id="bLv"></span><span class="thin bx"><i id="bxI"></i></span><span id="jLv"></span><span class="thin jx"><i id="jxI"></i></span></div>
        </div>
      </div>
      <div class="money"><span id="goldT"></span><small id="saveT"></small></div>
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="side">
      <button class="sbtn" data-panel="stats"><span>👤</span><small>สถานะ</small><span class="dot" id="dotStat" hidden></span></button>
      <button class="sbtn" data-panel="skills"><span>✨</span><small>สกิล</small><span class="dot" id="dotSkill" hidden></span></button>
      <button class="sbtn" data-panel="bag"><span>🎒</span><small>กระเป๋า</small></button>
      <button class="sbtn" data-panel="job" id="btnJob"><span>🎖️</span><small>อาชีพ</small></button>
      <button class="sbtn" data-panel="map"><span>🗺️</span><small>แผนที่</small></button>
      <button class="sbtn" data-panel="shop"><span>🔨</span><small>ร้าน</small></button>
      <button class="sbtn" data-panel="rank"><span>🏆</span><small>อันดับ</small></button>
      <button class="sbtn" data-panel="online"><span>👥</span><small>ผู้เล่น</small><span class="dot" id="dotOnline" hidden></span></button>
      <button class="sbtn" data-panel="sound"><span>⚙️</span><small>ตั้งค่า</small></button>
      <button class="sbtn" data-panel="gm" id="btnGM" hidden><span>👑</span><small>GM</small></button>
    </div>
    <div class="hud-bottom">
      <div class="pots">
        <button class="pot" id="chatBtn" aria-label="แชท">💬<span class="dot" id="dotChat" hidden></span></button>
        <button class="pot" id="potHp" aria-label="ยาแดง">🧪<b id="potHpN">0</b></button>
        <button class="pot blue" id="potSp" aria-label="ยาฟ้า">🧪<b id="potSpN">0</b></button>
      </div>
      <div class="skills" id="hotbar"></div>
      <button class="auto" id="autoBtn" aria-pressed="false">AUTO<span class="dot" id="autoDot" hidden></span></button>
    </div>
    <div class="zoom"><button id="zoomIn" aria-label="ซูมเข้า">＋</button><button id="zoomOut" aria-label="ซูมออก">－</button></div>
    <div class="chatfeed" id="chatFeed" aria-live="polite"></div>
    <div class="partyhud" id="partyHud" hidden></div>
    <div class="bossbar" id="bossBar" hidden></div>
    <div class="bossann" id="bossAnn" role="status" aria-live="polite"></div>
    <div class="invite" id="invite" hidden></div>
    <div class="dead" id="dead" hidden><div><div class="big">ถูกโค่นล้ม</div><div>ฟื้นคืนชีพใน <b id="deadT">4</b> วินาที</div></div></div>
  </section>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-title"><span id="sheetTitle"></span><button id="sheetClose" aria-label="ปิด">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="patchModal" hidden role="dialog" aria-modal="true" aria-labelledby="patchTitle">
  <div class="mcard">
    <div class="sheet-title"><span id="patchTitle"></span></div>
    <div class="mb"><p id="patchBody"></p><button class="btn-main" id="patchOk">ออกผจญภัยต่อ</button></div>
  </div>
</div>

(function () {

  let auth = null;
  const ERR = {

    'auth/wrong-password': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'auth/user-not-found': 'ยังไม่มีบัญชีนี้ กดสมัครใหม่ได้เลย',
    'auth/email-already-in-use': 'อีเมลนี้มีบัญชีอยู่แล้ว ลองกดเข้าสู่ระบบ', 'auth/credential-already-in-use': 'บัญชีนี้มีตัวละครอยู่แล้ว',
    'auth/weak-password': 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร', 'auth/too-many-requests': 'ลองหลายครั้งเกินไป รอสักครู่แล้วลองใหม่',
    'auth/popup-closed-by-user': 'ปิดหน้าต่าง Google ก่อนล็อกอินเสร็จ ลองใหม่อีกครั้ง', 'auth/cancelled-popup-request': 'ปิดหน้าต่าง Google ก่อนล็อกอินเสร็จ',

  const errText = (e) => ERR[e && e.code] || ('ล็อกอินไม่สำเร็จ (' + ((e && (e.code || e.message)) || 'ไม่ทราบสาเหตุ') + ')');
  const $i = (id) => document.getElementById(id);
  function loginUI() {

    const st = document.createElement('style');
    st.textContent = '.fbl{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;overflow:auto}' +
      '.fbl[hidden]{display:none}.fbl-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:center}' +
      '.fbl-card input{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:1rem}' +
      '.fbl-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.fbl-or{color:var(--ink-soft);font-size:.82rem;margin-top:4px}' +
      '.fbl-err{min-height:1.2em;margin:0;color:var(--bad);font-size:.85rem}.fbl-guest{background:none;border:0;color:var(--accent-ink);font-weight:700;text-decoration:underline;padding:8px}' +

      '<button class="btn-main gbtn" id="fbGoogle"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>เข้าสู่ระบบด้วย Google</button>' +

const monExp = (lv) => Math.round(4 * Math.pow(lv, 1.6) + 5);
function monStats(lv, boss) {
  const k = boss ? 1 : 0;
  return {
    hp: Math.round((40 + 22 * lv + 0.2 * lv * lv) * (k ? 5 : 1)),
    atk: Math.round((6 + 1.4 * lv + 0.045 * lv * lv) * (k ? 1.4 : 1)),
    def: Math.round(lv * 0.6 * (k ? 1.3 : 1)),
    bexp: monExp(lv) * (k ? 8 : 1),
    jexp: Math.round(monExp(lv) * 0.75) * (k ? 8 : 1),
    gold: Math.round((3 + lv * 1.6) * (k ? 10 : 1))
  };
}
function MON(id, name, arch, color, lv, extra) {
  const boss = !!(extra && extra.boss);
  return Object.assign({ id, name, arch, color, lv, aggro: false, boss: false }, monStats(lv, boss), extra || {});
}

/* ---------- sanitizers ---------- */
function num(v, d, min, max) { v = Number(v); if (!Number.isFinite(v)) v = d; return Math.min(max, Math.max(min, v)); }
function int(v, d, min, max) { return Math.round(num(v, d, min, max)); }
function str(v, d, max) { return (typeof v === 'string' && v.trim()) ? v.slice(0, max) : d; }
function txt(v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; }
function color(v, d) { return (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v)) ? v : d; }
const clone = (o) => JSON.parse(JSON.stringify(o));

function sanitizeConfig(raw) {
  raw = raw || {};
  const r = raw.rates || {};
  const req = Array.isArray(raw.jobReq) ? raw.jobReq : DEFAULT_CONFIG.jobReq;
  const maps = Array.isArray(raw.maps) && raw.maps.length ? raw.maps : DEFAULT_CONFIG.maps;
  const jn = {};
  if (raw.jobNames && typeof raw.jobNames === 'object') for (const k in JOBS) { const v = str(raw.jobNames[k], '', 24); if (v) jn[k] = v; }
  const c = {
    version: str(raw.version, DEFAULT_CONFIG.version, 20),
    patchNotes: txt(raw.patchNotes, 2000),
    announcement: txt(raw.announcement, 300),
    rates: { bexp: num(r.bexp, 1, 0, 100), jexp: num(r.jexp, 1, 0, 100), gold: num(r.gold, 1, 0, 100), drop: num(r.drop, 1, 0, 100) },
    deathPenalty: num(raw.deathPenalty, 1, 0, 100),
    cardChance: num(raw.cardChance, 1, 0, 100),
    jobReq: [0, 1, 2].map((i) => {
      const d = DEFAULT_CONFIG.jobReq[i], p = Array.isArray(req[i]) ? req[i] : d;
      return [int(p[0], d[0], 1, 999), int(p[1], d[1], 2, 999)];
    }),
    finalJobCap: int(raw.finalJobCap, 70, 2, 999),
    maxBase: int(raw.maxBase, 99, 10, 999),
    potion: { hp: int(raw.potion && raw.potion.hp, 30, 0, 1e9), sp: int(raw.potion && raw.potion.sp, 80, 0, 1e9) },
    jobNames: jn,
    shop: (() => {
      const sh = raw.shop || {}, g = {};
      if (sh.gear && typeof sh.gear === 'object') for (const id of Object.keys(sh.gear).slice(0, 80)) {
        if (!/^[a-z0-9_]{1,20}$/.test(id)) continue;
        const x = sh.gear[id] || {}, o = {};
        if (x.pr != null) o.pr = int(x.pr, 0, 0, 1e9);
        if (x.on === false) o.on = false;
        g[id] = o;
      }
      return { gear: g, refineW: int(sh.refineW, 150, 1, 1e9), refineA: int(sh.refineA, 120, 1, 1e9) };
    })(),
    maps: maps.slice(0, 20).map((m, i) => ({
      id: str(m && m.id, 'map' + i, 40),
      name: str(m && m.name, 'แผนที่ ' + (i + 1), 40),
      theme: THEME_LIST.includes(m && m.theme) ? m.theme : 'grass',
      min: int(m && m.min, 1, 1, 999), max: int(m && m.max, 99, 1, 999),
      count: int(m && m.count, 7, 1, 14),
      monsters: (m && Array.isArray(m.monsters) ? m.monsters : []).slice(0, 10).map((x, j) => ({
        id: str(x && x.id, 'm' + i + '_' + j, 40),
        name: str(x && x.name, 'มอนสเตอร์', 30),
        arch: ARCHES.includes(x && x.arch) ? x.arch : 'blob',
        color: color(x && x.color, '#88aacc'),
        lv: int(x && x.lv, 1, 1, 999),
        hp: int(x && x.hp, 50, 1, 1e9), atk: int(x && x.atk, 5, 0, 1e9), def: int(x && x.def, 0, 0, 1e6),
        bexp: int(x && x.bexp, 5, 0, 1e9), jexp: int(x && x.jexp, 4, 0, 1e9), gold: int(x && x.gold, 2, 0, 1e9),
        aggro: !!(x && x.aggro), boss: !!(x && x.boss), rs: int(x && x.rs, 30, 1, 10080),
        cs: CS_TH[x && x.cs] ? x.cs : (ARCH_CS[x && x.arch] || 'armor')
      }))
    }))
  };
  // job requirements must climb
  for (let i = 1; i < 3; i++) if (c.jobReq[i][0] < c.jobReq[i - 1][0]) c.jobReq[i][0] = c.jobReq[i - 1][0];
  return c;
}
/* =================== ART =================== */
function hexRgb(h) {
  h = String(h || '').replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  const n = parseInt(h, 16);
  if (!Number.isFinite(n)) return [180, 180, 190];
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function shade(h, a) {
  const [r, g, b] = hexRgb(h);
  const f = (c) => Math.max(0, Math.min(255, Math.round(a < 0 ? c * (1 + a) : c + (255 - c) * a)));
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function rgba(h, a) { const [r, g, b] = hexRgb(h); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'text') n.textContent = v;
    else if (k === 'class') n.className = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }

  return n;
}

function skillDesc(sk, lv) {
  lv = Math.max(1, lv);
  const pct = (v) => Math.round(v * 100) + '%';
  const bt = (o) => Object.keys(o).map((k) => BUFF_TH[k] + ' +' + Math.round(o[k] * lv * 10) / 10 + (PCT_KEYS[k] ? '%' : '')).join(' ');
  switch (sk.type) {
    case 'atk': return (sk.dmg === 'magic' ? 'เวทโจมตี ' : 'โจมตี ') + pct(sk.m[0] + sk.m[1] * lv) + (sk.hits > 1 ? ' (' + sk.hits + ' ครั้ง)' : '') + (sk.crit ? ' คริติคอลแน่นอน' : '');
    case 'aoe': return (sk.dmg === 'magic' ? 'เวทวงกว้าง ' : 'โจมตีวงกว้าง ') + pct(sk.m[0] + sk.m[1] * lv) + (sk.self ? ' รอบตัว' : ' รอบเป้าหมาย');
    case 'heal': return 'ฟื้น HP ' + pct(sk.h[0] + sk.h[1] * lv) + ' + ตามพลังเวท';
    case 'buff': return bt(sk.b) + ' นาน ' + sk.dur + ' วิ';
    case 'passive': return bt(sk.p);
  }
  return '';
}

}
function autoAlloc() {

function onConfigChanged() {
  if (S.screen === 'create') { document.querySelectorAll('.pj').forEach((b, i) => { const ids = ['novice', ...FIRST_JOBS, 'lordknight', 'highpriest', 'highwizard', 'sniper', 'assassincross', 'whitesmith']; b.textContent = jobName(ids[i]); }); }
  if (!S.hero || S.screen !== 'game') return;
  const m = currentMap();
  if (JSON.stringify(m) !== W.mapSig) enterMap(m.id, true);
  renderNotice(); hudText(); renderSheetIfOpen();
  if (S.sheet === 'gm' && !S.draftDirty) { S.draft = clone(CONFIG); rebuildGM(); }
  maybeShowPatch();
}
function maybeShowPatch() {
  if (!S.hero || S.screen !== 'game' || !CONFIG.patchNotes || lsGet(LS_SEEN) === CONFIG.version) return;
  $('#patchTitle').textContent = 'อัปเดตแพตช์ ' + CONFIG.version;
  $('#patchBody').textContent = CONFIG.patchNotes;
  $('#patchModal').hidden = false;
}
$('#patchOk').addEventListener('click', () => { lsSet(LS_SEEN, CONFIG.version); $('#patchModal').hidden = true; });

/* ---------- boot ---------- */
async function init() {
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    const [db, user] = await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]);
    S.db = db; S.user = user;
  }
  if (S.user) { S.uid = await S.user.id(); S.isOwner = await S.user.isOwner(); }
  initRoom();
  if (S.db) {
    S.db.doc('world/config').onSnapshot((snap) => { CONFIG = sanitizeConfig(snap.exists ? snap.data() : DEFAULT_CONFIG); onConfigChanged(); }, () => {});
    S.db.collection('heroes').orderBy('level', 'desc').limit(50).onSnapshot((snap) => {
      S.players = snap.docs.map((d) => Object.assign({ id: d.id }, sanitizeHero(d.data())));
      S.boardReady = true;
      if (S.sheet === 'rank') renderSheet();
      if (S.sheet === 'gm') renderGMPlayers();
    }, () => { S.boardReady = true; });
    chatInit(); bossInit();
  }
  let hero = null, fromServer = false;
  if (S.db && S.uid) {
    S.mode = 'online';
    try { const snap = await S.db.doc('heroes/' + S.uid).get(); if (snap.exists) { hero = sanitizeHero(snap.data()); fromServer = true; } } catch (e) {}
  }
  if (!hero) { try { const l = JSON.parse(lsGet(LS_SAVE + (S.uid || '')) || 'null'); if (l) hero = sanitizeHero(l); } catch (e) {} }
  if (!S.db) BOSS.loaded = true;
  if (hero) { S.hero = hero; S.savedOnline = fromServer; if (!fromServer) save(); showSelect(); } else setupCreate();
  if (S.db && S.uid) {
    S.db.doc('heroes/' + S.uid).onSnapshot((snap) => {
      if (!snap.exists || !S.hero) return;
      const d = snap.data();
      if (num(d.gmStamp, 0, 0, 1e15) > (S.hero.gmStamp || 0)) {
        S.hero = sanitizeHero(d); P.D = derived();
        P.hp = Math.min(Math.max(1, P.hp), P.D.maxHp); P.sp = Math.min(P.sp, P.D.maxSp);
        saveLocal(); renderAll(); renderSheetIfOpen();
        toast('GM ได้ปรับข้อมูลตัวละครของคุณ');
      }
    }, () => {});
  }
}
let lastTs = 0;
function frame(ts) {
  const now = ts / 1000, dt = Math.min(0.1, Math.max(0, now - (lastTs || now)));
  lastTs = now;
  try {
    if (S.screen === 'game' && S.hero && W.map) { update(dt); onlineTick(dt); bossTick(); draw(); hud(); }
    else if (S.screen === 'create') drawPreview(now);
    else if (S.screen === 'select') drawSelect(now);
    drawEquipPreview(now);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
R3.init();
requestAnimationFrame(frame);
init().catch((e) => { console.error(e); if (!S.hero) setupCreate(); });
})();
